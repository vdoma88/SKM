services:
  - type: web
    name: skm-tooling-selector
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      # Optional: add GEMINI_API_KEY in Render Dashboard for raster blueprint scan Vision AI
      # Optional: add DATABASE_URL if you attach a Render PostgreSQL database
