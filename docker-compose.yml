services:
  db:
    image: postgres:16-alpine
    container_name: skm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tooling_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tooling_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: skm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password@db:5432/tooling_db
    ports:
      - "8000:8000"

volumes:
  pgdata:
